# Let Netlify's Next.js adapter choose the publish output.
# Public browser keys are inlined into the client bundle on purpose.
[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,REWARD_PROVIDER"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
